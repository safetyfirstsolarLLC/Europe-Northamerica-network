name: Render IG Reel Video

on:
  workflow_dispatch:

# Give the workflow permission to write/push commits back to the repo
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install "moviepy==1.0.3" gTTS requests Pillow

      - name: Render Video File
        run: |
          python render_script.py

      - name: Commit and Push Video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ig-media/
          git commit -m "Auto-rendered Reel MP4" || echo "No changes to commit"
          git push origin main
