name: Render IG Reel Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, ImageMagick & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu
          # Fix ImageMagick policy permission restriction for text rendering
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true
          pip install "moviepy==1.0.3" gTTS requests Pillow

      - name: Render Video File
        run: |
          python render_script.py

      - name: Commit and Push Video
        run: |
          git config --global user.name "GitHub Cloud Renderer"
          git config --global user.email "renderer@github.com"
          git add assets/ig-media/
          git commit -m "Auto-rendered Reel MP4" || exit 0
          git push
