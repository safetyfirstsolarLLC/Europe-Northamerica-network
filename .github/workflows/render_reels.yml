name: Render IG Reel Video

on:
  workflow_dispatch: # Allows manual trigger or API calls

# Give the workflow permission to write/push commits back to the repo
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git history and clean pushing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

- name: Install Python Rendering Pipeline
        run: |
          pip install --upgrade pip
          pip install "moviepy==1.0.3" requests rembg onnxruntime edge-tts numpy Pillow

      - name: Execute Render Script
        run: |
          python render_script.py

      - name: Commit and Push Rendered Video
        # Check permissions settings first if this step fails (exit code 128)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ig-media/
          git commit -m "Auto-rendered Transparent Spinning Reel MP4" || echo "No changes to commit"
          git push origin main
