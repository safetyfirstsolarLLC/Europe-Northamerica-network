name: Render IG Reel Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "pillow>=10.0.0" "moviepy==1.0.3" requests edge-tts numpy

      - name: Ensure Assets Directory Exists
        run: |
          mkdir -p assets/ig-media

      - name: Execute Render Script
        run: |
          python -u render_script.py

      - name: Commit and Push Rendered Video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ig-media/
          git status
          git commit -m "Auto-rendered Reel MP4" || echo "No changes to commit"
          git push origin main
